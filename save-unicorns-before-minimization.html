function drawHorse(x,y,px,opt){
  opt = opt||{};
  const coat = opt.coat || '#ffffff';
  const mane = opt.mane || '#e8b8ff';
  HORSE.forEach((row,r)=>{
    [...row].forEach((ch,c)=>{
      let col = null;
      if(ch==='B') col = coat;
      else if(ch==='M') col = mane;
      else if(ch==='L') col = '#f5e4b2';
      else if(ch==='H'){
        const dist = 4 - r;
        const hornLevel = opt.hornSize==='short' ? 2 : opt.hornSize==='medium' ? 3 : 4;
        let hatLevel = 0;
        if(opt.hat){
          const hatObj = HATS.find(h=>h.id===opt.hat);
          if(hatObj){
            hatLevel = hatObj.hornTier==='short' ? 2 : hatObj.hornTier==='medium' ? 3 : 4;
          }
        }
        col = (opt.horn && dist <= hornLevel && dist > hatLevel) ? '#f5e4b2' : null;
      }
      if(col){ 
        ctx.fillStyle = col; 
        ctx.fillRect(x+c*px, y+r*px, px, px); 
      }
    });
  });
  if(opt.pattern==='striped'){
    ctx.fillStyle = '#ffffff';
    for(let c=4; c<13; c+=2) ctx.fillRect(x+c*px, y+8*px, px, 5*px);
  } else if(opt.pattern==='spotted'){
    ctx.fillStyle = '#ffffff';
    [[5,9],[8,10],[10,9],[6,11],[11,11]].forEach(([c,r])=>ctx.fillRect(x+c*px,y+r*px,px,px));
  } else if(opt.pattern==='patched'){
    ctx.fillStyle = '#e8e2d6';
    ctx.fillRect(x+8*px,y+8*px,4*px,4*px);
  }
  if(opt.hat){
    const hatObj = HATS.find(h=>h.id===opt.hat);
    const tier = hatObj ? hatObj.hornTier : 'short';
    const w = tier==='short'?4:tier==='medium'?5:6;
    const h = tier==='short'?2:tier==='medium'?3:4;
    if(opt.hat==='royal_guard'){
      ctx.fillStyle = '#8a1f1f';
      ctx.fillRect(x+(12-w/2)*px, y+(3-h)*px, w*px, h*px);
      ctx.fillStyle = '#dca035';
      ctx.fillRect(x+11*px, y+(2-h)*px, 2*px, px);
      ctx.fillStyle = '#232019';
      ctx.fillRect(x+9*px, y+3*px, 6*px, px);
    } else if(opt.hat==='chef'){
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x+(12-w/2)*px, y+(3-h)*px, w*px, h*px);
      ctx.fillRect(x+10*px, y+(2-h)*px, 4*px, px);
      ctx.fillStyle = '#dddddd';
      ctx.fillRect(x+9*px, y+3*px, 6*px, px);
    } else if(opt.hat==='firefighter'){
      ctx.fillStyle = '#b33927';
      ctx.fillRect(x+(12-w/2)*px, y+(3-h)*px, w*px, h*px);
      ctx.fillStyle = '#dca035';
      ctx.fillRect(x+11*px, y+(3-h/2)*px, px, px);
      ctx.fillStyle = '#3a2010';
      ctx.fillRect(x+8*px, y+3*px, 7*px, px);
    } else if(opt.hat==='police'){
      ctx.fillStyle = '#22385c';
      ctx.fillRect(x+(12-w/2)*px, y+(3-h)*px, w*px, h*px);
      ctx.fillStyle = '#dca035';
      ctx.fillRect(x+11*px, y+(3-h)*px, px, px);
      ctx.fillStyle = '#111116';
      ctx.fillRect(x+9*px, y+3*px, 6*px, px);

      ctx.fillStyle = '#e69819';
      ctx.fillRect(x+(12-w/2)*px, y+(3-h)*px, w*px, h*px);
      ctx.fillStyle = '#a66b0c';
      ctx.fillRect(x+9*px, y+3*px, 6*px, px);
    }
  }
  if(opt.clothes){
    ctx.fillStyle = opt.clothes;
    ctx.fillRect(x+4*px, y+9*px, 6*px, 2*px);
  }
}

function drawScene(grid, palette, x, y, px, bgHex){
  if(bgHex){
    ctx.fillStyle = '#' + bgHex;
    ctx.fillRect(x, y, grid[0].length*px, grid.length*px);
  }
  grid.forEach((row,r)=>{
    [...row].forEach((ch,c)=>{
      if(ch==='.') return;
      ctx.fillStyle = '#' + palette[+ch];
      ctx.fillRect(x+c*px, y+r*px, px, px);
    });
  });
}
let actx, soundOn = true;
function gunshot(){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const dur = 0.22, sr = actx.sampleRate, n = sr*dur;
    const buf = actx.createBuffer(1, n, sr);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, 3);
    const src = actx.createBufferSource(); src.buffer = buf;
    const filt = actx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=1600;
    const gain = actx.createGain(); gain.gain.value = 0.85;
    src.connect(filt); filt.connect(gain); gain.connect(actx.destination);
    src.start();
  }catch(e){}
}
function chime(){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 680; o.type='sine';
    g.gain.setValueAtTime(0.18, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+0.45);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+0.45);
  }catch(e){}
}

function drawBG(color){ 
  ctx.fillStyle = color; 
  ctx.fillRect(0,0,640,400); 
  tctx.clearRect(0,0,640,400); 
}
function wrapText(text, maxW){
  const words = text.split(' ');
  let lines = [], line = '';
  words.forEach(w=>{
    const test = line ? line+' '+w : w;
    if(tctx.measureText(test).width > maxW){ lines.push(line); line = w; }
    else line = test;
  });
  lines.push(line);
  return lines;
}
function playTextScene(lines, onDone, opt){
  opt = opt || {};
  let i = 0;
  document.getElementById('clickHint').classList.remove('hidden');
  function showLine(){
    drawBG(opt.bg || '#000');
    if(opt.draw) opt.draw();
    tctx.font = '15px "Courier New"';
    tctx.fillStyle = '#e9e2d0';
    tctx.textAlign = 'left';
    const wrapped = wrapText(lines[i], 500);
    wrapped.forEach((l,li)=> tctx.fillText(l, 70, 330 + li*22));
    if(opt.speaker){
      tctx.fillStyle = '#c9a24b';
      tctx.font = 'bold 13px "Courier New"';
      tctx.fillText(opt.speaker, 70, 310);
    }
  }
  advanceFn = ()=>{
    i++;
    if(i>=lines.length){
      advanceFn = null;
      document.getElementById('clickHint').classList.add('hidden');
      cv.style.opacity = '0';
      setTimeout(()=>{ onDone(); cv.style.opacity = '1'; }, 350);
      return;
    }
    showLine();
  };
  showLine();
}

    return; 
  }
  renderDressUp();

function renderDressUp(){
  const u = dressCtx.list[dressCtx.idx];
  drawBG('#0a0a0c');
  const boxX = 16, boxY = 14, boxW = 394, boxH = 286;
  ctx.strokeStyle = '#2c251c';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(boxX, boxY, boxW, boxH);
  const horseX = Math.round(boxX + (boxW - 192) / 2) - 5;
  const horseY = Math.round(boxY + (boxH - 192) / 2);
  const hornLevels = [
    {tier:'tall', y: horseY + Math.round(0.5 * 12), label:'TALL (T)'},
    {tier:'medium', y: horseY + Math.round(1.5 * 12), label:'MED  (M)'},
    {tier:'short', y: horseY + Math.round(2.5 * 12), label:'SHRT (S)'},
  ];
  ctx.font = '9px "Courier New"';
  hornLevels.forEach(hl=>{
    const isThisTier = u.hornSize === hl.tier;
    ctx.setLineDash([3,3]);
    ctx.strokeStyle = isThisTier ? '#dca035' : '#332f26';
    ctx.fillStyle = isThisTier ? '#f5dc99' : '#554f42';
    ctx.beginPath();
    ctx.moveTo(horseX + 14 * 12 + 6, hl.y);
    ctx.lineTo(horseX + 14 * 12 + 36, hl.y);
    ctx.stroke();
    ctx.fillText(hl.label, horseX + 14 * 12 + 42, hl.y + 3);
  });
  ctx.setLineDash([]);
  drawHorse(horseX, horseY, 12, {
    coat: u.body ? colorForBody(u.body) : '#ffffff',
    mane: u.mane ? MANE_COLORS[u.mane].hex : '#e8b8ff',
    pattern: patternForBody(u.body),
    horn: true,
    hornSize: u.hornSize,
    hat: u.hat,
    clothes: u.clothes ? clothesColor(u.clothes) : null,
  });
  document.getElementById('dressContainer').classList.remove('hidden');
  document.getElementById('unicornCounterText').textContent = 
    `Disguise unicorn ${dressCtx.idx + 1} of ${dressCtx.list.length}`;
  const tierBadge = document.getElementById('hornTierBadge');
  tierBadge.textContent = u.hornSize.toUpperCase();
  tierBadge.style.color = u.hornSize==='tall'?'#e68a4e':u.hornSize==='medium'?'#dca035':'#8fd39f';

    if(tab.dataset.tab === activeTab){
      tab.classList.add('active');
    } else {
      tab.classList.remove('active');
    }
  });

  renderBottomSlots(u);
}

        `;
      }).join('')}
    `;
  } else {
    pageNum.textContent = 'Pages 3-4 of 4';
    left.innerHTML = `
      <h3>Hat Directory <span class="bookTag">Disguises</span></h3>
      <div style="font-size:9px;color:#5a4932;margin-bottom:8px">Hats must match or exceed the unicorn's horn height, or the horn tip will be exposed to border guards.</div>
      ${HATS.map(h=>{
        return `
          <div class="bookEntry">
            <div class="bookEntryHeader">
              <span>${h.icon}</span>
              <span class="bookEntryTitle">${h.label}</span>
              <span class="bookTag">${h.hornTier} horn</span>
            </div>
            <div class="bookEntryDesc">${h.desc}</div>
            <div class="bookEntrySpecs">
              <b>Primary Breed:</b> ${SPECIES.find(s=>s.id===h.speciesId).name}
            </div>
          </div>
        `;
      }).join('')}
    `;
    right.innerHTML = `
      <h3>Border Protocols <span class="bookTag">Field Intel</span></h3>
      <div class="bookEntry">
        <div class="bookEntryTitle">1. Horn Concealment (Strict)</div>
        <div class="bookEntryDesc">A short hat on a medium/tall horn leaves the tip visible. Result: instant capture.</div>
      </div>
      <div class="bookEntry">
        <div class="bookEntryTitle">2. Mane Dyeing (Essential)</div>
        <div class="bookEntryDesc">Natural lavender mane color is an immediate dead giveaway. It must be dyed.</div>
      </div>
      <div class="bookEntry">
        <div class="bookEntryTitle">3. Full Breed Match (High Odds)</div>
        <div class="bookEntryDesc">When Hat, Mane color, and Coat color all match an authentic breed profile, checkpoint passage is guaranteed.</div>
      </div>
      <div class="bookEntry">
        <div class="bookEntryTitle">4. Risk Management</div>
        <div class="bookEntryDesc">If you lack the right coat clay, a good hat and dyed mane still have a chance if the guards are inattentive.</div>
      </div>
    `;
  }
}
function score(u, guardTired){
  const hat = HATS.find(h=>h.id===u.hat);
  const hornTiers = {short:2, medium:3, tall:4};
  const hatCover = hat ? hornTiers[hat.hornTier] : 0;
  const neededCover = hornTiers[u.hornSize];
  if(hatCover < neededCover || !u.mane){
    return {
      pass: false, 
      reason: !hat 
        ? 'no hat was equipped — the horn was in plain sight' 
        : hatCover < neededCover 
          ? `the ${hat.label} was too short for the ${u.hornSize} horn` 
          : 'the mane was left in its natural unicorn color'
    };
  }
  const breed = hat ? SPECIES.find(s=>s.id===hat.speciesId) : null;
  const breedOK = breed && u.body === breed.id;
  if(breedOK){
    return {pass: true, reason: `hat, mane, and coat matched the ${breed.name} disguise perfectly`};
  }
  const pass = guardTired || Math.random() < 0.55;
  return {
    pass, 
    reason: pass 
      ? 'the hat and dyed mane concealed the horn enough to slip through' 
      : 'coat color did not match the disguise identity, and guards grew suspicious'
  };
}
function start(){
  const peaceLines = [
    "A long time ago, horses and unicorns lived together in peace and harmony.",
  ];
  const warLines = [
    "But everything ended in a single night of sudden chaos. The Great Equine War started and never truly ended.",
    "Every unicorn was banished, and those found within the horses' lands were slaughtered on sight.",
    "Most unicorns escaped. But many were left behind.",
  ];
  const forestLine = [
    "Those who remained fled to an abandoned forest, isolated, unseen and forgotten.",
  ];
  const castleLines = [
    "In the dark they waited for the chance to escape the land.",
    "To find their way home, to the unicorn kingdom where everyone remembered their names.",
  ];
  playTextScene(peaceLines, ()=>{
    playTextScene(warLines, ()=>{
      playTextScene(forestLine, ()=>{
        playTextScene(castleLines, sceneFarm1, {bg:'#000', draw:()=> drawScene(SCENE5, PAL3, 40, 0, 5, 'C68323')});
      }, {bg:'#000', draw:()=> drawScene(SCENE3, PAL3, 40, 0, 5, 'C68323')});
    }, {bg:'#000', draw:()=> drawScene(SCENE2, PAL3, 40, 0, 5, 'C68323')});
  }, {bg:'#000', draw:()=> drawScene(SCENE1, PAL3, 40, 0, 5, 'C68323')});
}
function sceneFarm1(){
  const lines = [
    "You are a plain white horse who runs a hat stall in the town square, dyes and trims for whoever needs a fresh look.",
    "One afternoon, a hooded figure lingers at your stall long after the other customers have gone.",
  ];
  playTextScene(lines, sceneUnicornBegs, {bg:'#101418', draw:()=>{
    drawHorse(40, 170, 10, {coat:'#eee', mane:'#ccc'});
  }});
}
function sceneUnicornBegs(){
  const lines = [
    "The hood slips, just for a second. A horn. A unicorn — undercover, terrified.",
    "You've heard the stories. You know what happens to unicorns found this close to the gate.",
    "Something in you understands her fear better than she'd guess — you've been looked at sideways too, more than once, for reasons you don't talk about.",
    "Without a word, you pick out a hat that'll hide her horn, and mix a grey dye for her mane. No charge.",
  ];
  playTextScene(lines, sceneBorder1, {bg:'#101418', draw:()=>{
    drawScene(SCENE_TOWN, TOWN_PALETTE, 40, 0, 7);
    drawHorse(40, 170, 10, {coat:'#eee', mane:'#ccc'});
    drawHorse(260, 170, 10, {coat:'#fff', mane:'#e8b8ff', horn:true});
  }});
}
function sceneBorder1(){
  clearUI();
  const lines = [
    "She heads for the border checkpoint, hat low over her horn, mane freshly dyed grey.", 
    "You watch from a distance, heart pounding."
  ];
  playTextScene(lines, ()=>{
    setTimeout(()=>{
      chime();
      playTextScene(["She crosses. No one stops her. She's free."], ()=> sceneReward1(true), {bg:'#050508'});
    }, 300);
  }, {bg:'#050508'});
}
function sceneReward1(survived){
  state.day = 2;
  const lines = survived ? [
    "The next morning, a little bird taps at your window.",
    "When you get close, it flies off — but leaves a letter and a small bag of coins.",
    '"Thank you. I made it. This is all I have to give — please, take it." — the letter reads.',
  ] : [
    "The morning is quiet. Too quiet.",
    "You never hear from her again.",
  ];
  if(survived) state.gold += 12;
  playTextScene(lines, sceneTimeSkip, {bg:'#1a1610', draw:()=> drawHorse(240, 170, 10, {coat:'#eee', mane:'#ccc'})});
}
function sceneTimeSkip(){
  playTextScene(["... after some days ..."], sceneThreeUnicorns, {bg:'#000'});
}
function sceneThreeUnicorns(){
  try{ localStorage.setItem('su_progress', 'act2'); }catch(e){}
  const lines = [
    "Word travels fast, even in hiding.",
    '"There\'s a hatter in town who helps our kind," they whisper.',
    "Now three hooded unicorns linger at your stall at once, waiting for the square to empty.",
    "This is no longer a quiet favor. If you're caught, you hang beside them.",
  ];
  const list = [mkUnicorn(), mkUnicorn(), mkUnicorn()];
  playTextScene(lines, ()=> startDressUp(list, false, ()=>sceneBorder2(list)), {bg:'#101418', draw:()=>{
    drawScene(SCENE_TOWN, TOWN_PALETTE, 40, 0, 7);
    drawHorse(20, 170, 10, {coat:'#fff', mane:'#e8b8ff', horn:true});
    drawHorse(210, 170, 10, {coat:'#fff', mane:'#b8e8ff', horn:true});
    drawHorse(400, 170, 10, {coat:'#fff', mane:'#ffe8b8', horn:true});
  }});
}
function sceneBorder2(list){
  clearUI();
  const lines = ["Three shapes move toward the checkpoint under a moonless sky."];
  const guardTired = Math.random() < 0.35;
  playTextScene(lines, ()=>{
    const results = list.map(u=>{
      if(u.declined) return {u, survived:false, reason:'you turned them away — they tried alone and were caught'};
      const s = score(u, guardTired);
      return {u, survived: s.pass, reason: s.reason};
    });
    const anyDead = results.some(r=>!r.survived);
    setTimeout(()=>{
      if(anyDead) gunshot();
      const summaryLine = anyDead 
        ? "Shots ring out in the dark. Not all of them made it." 
        : "Silence. All three cross safely.";
      playTextScene([summaryLine], ()=> sceneRating(results), {bg:'#050508'});
    }, 300);
  }, {bg:'#050508'});
}
function sceneRating(results){
  clearUI();
  drawBG('#0e0e14');
  ctx.fillStyle='#c9a24b'; 
  ctx.font='18px "Courier New"'; 
  ctx.fillText('Outcome', 30, 40);
  let y = 80, totalGold = 0;
  results.forEach((r,i)=>{
    const pay = r.survived ? (5 + i) : 0;
    totalGold += pay;
    ctx.fillStyle = r.survived ? '#8fd39f' : '#e39a9a';
    ctx.font='13px "Courier New"';
    ctx.fillText(`Unicorn ${i+1}: ${r.survived ? 'survived' : 'did not survive'}`, 40, y);
    ctx.fillStyle = '#999'; 
    ctx.font='11px "Courier New"';
    ctx.fillText(r.survived ? `reward: ${pay}g` : `reason: ${r.reason}`, 40, y+16);
    y += 44;
  });
  state.gold += totalGold;
  ctx.fillStyle='#c9a24b';
  ctx.font='13px "Courier New"';
  ctx.fillText('Total gold earned: ' + totalGold + '  (bank: ' + state.gold + ')', 40, y+10);
  document.getElementById('clickHint').classList.remove('hidden');
  document.getElementById('clickHint').textContent = 'click to continue the story ▶';
  advanceFn = ()=>{
    advanceFn = null;
    playTextScene([
      "More will come. And the border only gets more careful.", 
      "(— end of prototype act —)"
    ], ()=>{}, {bg:'#000'});
  };
}
document.getElementById('quickDisguiseBtn').onclick = ()=>{
  clearUI();
  const list = [mkUnicorn(), mkUnicorn(), mkUnicorn()];
  startDressUp(list, false, ()=>sceneBorder2(list));
};
start();</script>
